# Herdr configuration, keyed to match the Tmux setup in this repository so the
# same fingers work in both. Only values that differ from Herdr's defaults are
# written out; `herdr --default-config` prints the full reference, and
# `herdr config check` validates this file.

onboarding = false

[theme]
name = "catppuccin-latte"
auto_switch = true
light_name = "catppuccin-latte"
dark_name = "catppuccin"

[keys]
# Prefix: 'Ctrl+t', the same key the .tmux.conf uses, in place of Herdr's own
# 'ctrl+b'. Herdr is prefix-driven like Tmux, so the prefix is a real prefix and
# porting the keymap is renaming keys rather than building modes.
prefix = "ctrl+t"

# ---------------------------------------------------------------------------
# Panes
# ---------------------------------------------------------------------------

# Splits. Herdr names these after the divider, the same convention the
# .tmux.conf comments use: split_vertical puts the new pane to the right,
# split_horizontal puts it below. Confirmed against Herdr's own guide, which
# documents the defaults as "prefix+v (right) / prefix+minus (down)".
#
# A literal backslash must be spelled out. "prefix+\" is rejected by
# `herdr config check`; "prefix+backslash" is accepted.
split_vertical = "prefix+backslash"
split_horizontal = "prefix+minus"

# Tmux's '[' and ']'. Herdr cycles rather than stepping through an index, but
# the direction is the same.
cycle_pane_previous = "prefix+["
cycle_pane_next = "prefix+]"

# ';' sits next to the ',' that renames a tab. Herdr's default is prefix+shift+p,
# wanted below for the pull-request popup. Tmux's ';' is last-pane, left unbound.
rename_pane = "prefix+;"

# Herdr binds close_pane to prefix+x and close_tab to prefix+shift+x, and both
# take effect immediately. Tmux wraps its 'x' and '&' in confirm-before; Herdr's
# only confirmation setting is ui.confirm_close, which by its own description
# covers closing a *workspace*, not a pane or a tab. An unprompted close one key
# from the prefix is not worth the keystroke it saves, so both are emptied.
#
# What remains: exiting the shell closes a pane, closing the last pane in a tab
# closes the tab, and prefix+shift+d still closes a workspace — that one does
# ask first.
close_pane = ""
close_tab = ""

# Tmux's 'bind v copy-mode'. Herdr's own copy mode: hjkl, w/b/e, '/' and '?' to
# search, v or Space to select, y to copy, q to leave. Its default is prefix+[,
# which the pane cycling above already uses, so it moves onto 'v' — free because
# split_vertical went to the backslash.
#
# 'copy_mode' is missing from `herdr --default-config` and from the keyboard
# page, which is why it read as absent at first; herdr.dev/docs/config-reference
# lists it with this same prefix+[ default.
copy_mode = "prefix+v"

# The whole scrollback in $EDITOR, which copy mode is not: searchable, saveable
# and editable at length. Back on Herdr's own default key.
edit_scrollback = "prefix+e"

# hjkl, which is both Herdr's own default and the Vim answer, plus the arrow keys
# Tmux uses for select-pane. One action takes a list of keys, so neither hand has
# to move. The array form is absent from `herdr --default-config`, but
# `herdr config check` parses it and names any bad key inside it.
focus_pane_left = ["prefix+h", "prefix+left"]
focus_pane_down = ["prefix+j", "prefix+down"]
focus_pane_up = ["prefix+k", "prefix+up"]
focus_pane_right = ["prefix+l", "prefix+right"]

# ---------------------------------------------------------------------------
# Tabs
# ---------------------------------------------------------------------------
#
# A Herdr tab is what Tmux calls a window.
#
# new_tab, next_tab, previous_tab and switch_tab already match Tmux and are
# left at their defaults: prefix+c, prefix+n, prefix+p and prefix+1..9. Herdr
# has no sub-modes competing for those letters, so 'p' means previous tab here
# rather than being spent on entering a mode.
rename_tab = "prefix+,"

# '<' and '>' move the tab along the tab bar. Not a Tmux binding — Tmux spends
# these on menus that Herdr has no equivalent for, so the keys are free.
move_tab_previous = "prefix+<"
move_tab_next = "prefix+>"

# ---------------------------------------------------------------------------
# Session
# ---------------------------------------------------------------------------

# Tmux's 'd'. Herdr's default is prefix+q.
detach = "prefix+d"

# ---------------------------------------------------------------------------
# Navigate mode — the picker on prefix+w
# ---------------------------------------------------------------------------
#
# These are local to that picker and independent of focus_pane_* above.
#
# Herdr's defaults put workspaces on the arrow keys and panes on hjkl. Panes
# are already reachable from the prefix with '[', ']' and h/l, so the vertical
# pair is worth more on the workspace list, which is the thing actually stacked
# vertically here.
#
# navigate_pane_down and _up have to be emptied rather than left out. Their
# defaults are 'j' and 'k', and while `herdr config check` accepts the overlap
# without complaint, that leaves which one wins undecided at runtime. Empty is
# unambiguous.
#
# The left and right arrows still move between panes — Herdr hardcodes those
# and they are not configurable.
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_left = "h"
navigate_pane_down = ""
navigate_pane_up = ""
navigate_pane_right = "l"

# ---------------------------------------------------------------------------
# Agents
# ---------------------------------------------------------------------------
#
# All three are unset in Herdr's defaults.
#
# There is no agent equivalent of the workspace picker: 'prefix+w' works the
# way it does because workspace_picker opens navigate mode, and the set of
# mode-opening actions is fixed — help, settings, open_notification_target,
# workspace_picker, goto, resize_mode, toggle_sidebar. None of them is about
# agents, and a config cannot define a new mode. So these are single-shot: the
# prefix is needed for each step rather than once for a run of them.
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"

# Indexed binding — one line covers agents 1 through 9. The literal '1..9' is
# required; `herdr config check` rejects anything else with "indexed keybinding
# must use 1..9". Ctrl rather than the Alt of Herdr's own example, to leave Alt
# chords with the terminal.
focus_agent = "prefix+ctrl+1..9"

# ---------------------------------------------------------------------------
# Swapping panes, Tmux's '{' and '}'
# ---------------------------------------------------------------------------
#
# swap_pane_* is missing from `herdr --default-config` the same way copy_mode is,
# and listed in the Config reference the same way too. Only the horizontal pair
# is moved here; up and down keep their prefix+shift+k / prefix+shift+j defaults,
# which nothing else in this file claims.
#
# Not an exact port: Tmux's swap-pane -U/-D walk the pane order, while Herdr
# swaps with whatever sits in a given direction. With a plain row or column the
# two agree; in a nested layout they can differ.
swap_pane_left = "prefix+{"
swap_pane_right = "prefix+}"

# ---------------------------------------------------------------------------
# Scrollback
# ---------------------------------------------------------------------------
#
# 5x Herdr's 10 MB default. The limit is bytes, not lines, and a row costs its
# full pane width — measured at ~9 bytes per cell, so lines ≈ limit / (cols * 9)
# no matter how much text is actually on each one. At the 268 columns a full-
# width pane gets here that is ~4,150 lines by default and ~20,700 at 50 MB.
#
# It applies per pane and grows with output rather than being reserved, but the
# ceiling is what matters with a few dozen panes open.
#
# A pane keeps the limit it was born with: after `herdr server reload-config` an
# existing pane still honours the old value, so only panes opened afterwards get
# a change. Measured here — the Config reference documents the per-pane limit but
# not when a change lands. Nothing here helps with programs on the alternate screen — pagers,
# editors, TUI agents — whose rows never enter the scrollback at all.
[advanced]
scrollback_limit_bytes = 50000000

# ---------------------------------------------------------------------------
# Notifications
# ---------------------------------------------------------------------------
#
# Off by default. 'herdr' draws the toast inside the Herdr frame, which works
# the same over SSH as locally; 'terminal' and 'system' hand it to the host,
# which a remote session cannot rely on. Fires when a background agent finishes
# or needs input, and only if it is still in that state a second later.
[ui.toast]
delivery = "herdr"

# ---------------------------------------------------------------------------
# GitHub issues involving me
# ---------------------------------------------------------------------------
#
# No Herdr action for this, so a custom command earns its keep here in a way the
# swap and focus ones did not. type = "popup" is session-modal, so the tab layout
# is untouched. fzf rather than a pager: this returns nearly 60 rows, which want
# filtering, and the preview turns the list into something readable.
#
# '--involves' covers author, assignee, reviewer and mentions. The limit is well
# past the current count on purpose — at 40 the list was silently truncated.
[[keys.command]]
key = "prefix+shift+i"
type = "popup"
width = "90%"
height = "80%"
command = '''gh search issues --involves=@me --state=open --limit 100 --json repository,number,title,updatedAt --template '{{range .}}{{printf "%-28s %-7v %s  (%s)\n" .repository.nameWithOwner .number .title (timeago .updatedAt)}}{{end}}' | fzf --reverse --header="issues involving me" --preview "gh issue view {2} --repo {1}" --preview-window=right:55%:wrap'''

# Pull requests, same shape as the issues popup above. '--involves' is wider than
# '--assignee', which returns nothing here: it covers author, assignee, reviewer
# and mentions. prefix+shift+p is free now that rename_pane moved to ';'.
[[keys.command]]
key = "prefix+shift+p"
type = "popup"
width = "90%"
height = "80%"
command = '''gh search prs --involves=@me --state=open --limit 100 --json repository,number,title,updatedAt --template '{{range .}}{{printf "%-28s %-7v %s  (%s)\n" .repository.nameWithOwner .number .title (timeago .updatedAt)}}{{end}}' | fzf --reverse --header="pull requests involving me" --preview "gh pr view {2} --repo {1}" --preview-window=right:55%:wrap'''
