# ==========================================
# 1. General Settings
# ==========================================
set -g mouse on               # Enable mouse support (clickable windows, panes, resizable panes)
set -g set-clipboard on       # Use system clipboard (Enables OSC 52 integration)

# ==========================================
# 2. Terminal & Color Settings
# ==========================================
# set -g default-terminal "tmux-256color"                                                   # Set the default terminal mode to 256 colors (fixes color issues inside tmux)
# set -ag terminal-overrides ",*256col*:colors=256:Tc"                                      # Enable True Color (24-bit) support if the outside terminal supports it
# set -ag terminal-overrides "vte*:XT:Ms=\\E]52;c;%p2%s\\7,xterm*:XT:Ms=\\E]52;c;%p2%s\\7"  # Manually configure OSC 52 escape sequences for clipboard integration over SSH

# ==========================================
# 3. Key Bindings (Copy Mode & Vi Style)
# ==========================================
setw -g mode-keys vi          # Use Vi keybindings in copy mode

# Prefix: 'Ctrl+t' instead of the default 'Ctrl+b'
unbind C-b
set -g prefix C-t
bind C-t send-prefix          # Press twice to send a literal Ctrl+t to the program inside

# Copy mode with 'v'
bind v copy-mode

# Vim-style copy mode selection and yanking
bind-key -T copy-mode-vi 'v' send -X begin-selection     # Start selection with 'v'
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle  # Toggle block selection with 'Ctrl+v'
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel   # Yank and exit copy mode

# Mouse wheel scroll speed. Tmux has no option for it — the count is the '-N'
# repeat below, 5 by default.
bind-key -T copy-mode-vi WheelUpPane   select-pane \; send -X -N 1 scroll-up
bind-key -T copy-mode-vi WheelDownPane select-pane \; send -X -N 1 scroll-down

# Pane navigation with '[' and ']'
bind -r '[' select-pane -t :.-
bind -r ']' select-pane -t :.+

# Splits: '\' for a vertical divider, '-' for a horizontal divider
bind '\' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"

# Synchronised input with 'i': typing goes to every pane in the window at once.
# Omitting the value makes Tmux toggle the flag, so the same key turns it off.
bind i setw synchronize-panes

# Flag the mode in the status bar — forgetting it is on means the next command
# runs in every pane. Appended so Tmux's own status-right stays intact, and
# 'red' is a palette name so it follows the terminal's light/dark theme.
# The unset comes first because appending is not idempotent: reloading this file
# with 'source-file' would otherwise stack another copy of the flag every time.
set -gu status-right
set -ga status-right "#{?pane_synchronized,#[fg=red#,bold] SYNC#[default],}"
# Tmux clips status-right to 40 characters by default, and its own contents
# already run to 39 — the flag would be cut off entirely. The pane title is
# capped at 21 characters, so the line tops out at 44. The rest of the room is
# for the '[x,y]' view offset Tmux prepends for a client whose terminal is
# smaller than the window, which is reachable here because the .zshrc attaches
# every SSH login to the same session: log in from two differently sized
# terminals and the smaller one renders the offset too.
set -g status-right-length 60

# ==========================================
# 4. Plugin Management (TPM)
# ==========================================
# List of plugins
set -g @plugin 'tmux-plugins/tpm'        # Tmux Plugin Manager
# set -g @plugin 'tmux-plugins/tmux-yank'   # Requires a local clipboard tool; useless on a headless server

# Initialize TMUX plugin manager (Keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
